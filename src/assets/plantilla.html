<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$titulo</title>
<style>
$fuentes
:root{
  --navy:#2C4255; --navy-deep:#1E2F3C; --gold:#C0A870; --gold-deep:#9C7E3E;
  --cream:#F7F3EA; --paper:#FFFFFF; --ink:#33373B; --muted:#6E7479; --line:#E4DDCB;
}
*{margin:0;padding:0;box-sizing:border-box}
@page{size:1280px 720px;margin:0}
html,body{background:#E9E3D5;color:var(--ink);font-family:'Lato',sans-serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

/* Cada diapositiva mide 1280 × 720 (16:9) y es una página del PDF. */
.slide{width:1280px;height:720px;background:var(--cream);padding:40px 56px 0;position:relative;
  display:flex;flex-direction:column;overflow:hidden;margin:24px auto;box-shadow:0 2px 14px rgba(30,47,60,.18)}
@media print{
  html,body{background:var(--cream)}
  .slide{margin:0;box-shadow:none;page-break-after:always;zoom:1 !important}
}

header{display:flex;align-items:center;justify-content:space-between;gap:20px}
header .logo{height:58px}
.htitle{text-align:right}
.htitle .kicker{font-weight:700;font-size:11px;letter-spacing:3.5px;color:var(--gold-deep);text-transform:uppercase}
.htitle h1{font-family:'Cinzel';font-weight:700;font-size:28px;color:var(--navy);letter-spacing:1.4px;margin-top:4px}

.rule{display:flex;align-items:center;gap:14px;margin:16px 0 18px}
.rule .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent)}
.rule .dot{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.rule .lbl{font-weight:700;font-size:12px;letter-spacing:4px;color:var(--navy);text-transform:uppercase}

.body{flex:1;min-height:0;display:flex;flex-direction:column}
footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);
  padding:10px 0 14px;font-size:11px;color:var(--muted);letter-spacing:1px}
footer .brand{font-family:'Cinzel';font-weight:600;color:var(--navy);letter-spacing:1.3px}

/* Portada */
.cover{justify-content:center;align-items:center;text-align:center;padding:40px 140px}
.cover .logo-v{height:230px;margin-bottom:10px}
.cover .rule{width:100%}
.cover h1{font-family:'Cinzel';font-weight:700;font-size:46px;color:var(--navy);letter-spacing:2px}
.cover .sub{font-family:'EB Garamond';font-style:italic;font-size:26px;color:var(--muted);margin-top:8px}
.cover .meta{font-size:13px;letter-spacing:1.6px;color:var(--gold-deep);text-transform:uppercase;font-weight:700;margin-top:26px}

.sec{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.sec .bar{width:4px;height:20px;background:var(--gold)}
.sec h2{font-family:'Cinzel';font-weight:600;font-size:16px;letter-spacing:1.8px;color:var(--navy);text-transform:uppercase}

.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 20px;
  display:flex;flex-direction:column;min-height:0}
.card .ct{font-family:'Cinzel';font-weight:600;font-size:14px;letter-spacing:1.2px;color:var(--navy);
  text-transform:uppercase;text-align:center;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;min-height:0;padding-bottom:16px}
.split{display:grid;grid-template-columns:400px 1fr;gap:24px;flex:1;min-height:0;padding-bottom:16px}
.card.solo{flex:1;margin-bottom:16px}
.chart{display:block;max-width:100%;max-height:100%;min-height:0;margin:auto;object-fit:contain}
.body > .chart{flex:1;width:100%;object-fit:contain;padding-bottom:10px}

.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;justify-content:center}
.donut-wrap img{width:230px;height:230px}
.legend{display:flex;flex-direction:column;gap:8px;width:100%}
.legend .it{display:flex;align-items:center;gap:10px;font-size:14px}
.legend .sw{width:13px;height:13px;border-radius:2px;flex:none}
.legend .it b{margin-left:auto;color:var(--navy);font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi{background:var(--navy);color:#fff;border-radius:3px;padding:20px 12px 18px;text-align:center;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
.kpi .v{font-family:'Cinzel';font-weight:700;font-size:34px;letter-spacing:.5px}
.kpi .l{font-weight:700;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#C4D0DA;margin-top:6px}
.kpi .d{font-size:12px;color:#E8E1CF;margin-top:6px}
.kpi.alt{background:var(--paper);color:var(--navy);border:1px solid var(--line)}
.kpi.alt .l{color:var(--muted)} .kpi.alt .d{color:var(--gold-deep)}

.pres{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--navy);margin-top:16px;
  padding:16px 22px;font-family:'EB Garamond';font-size:16px;line-height:1.6;color:#3c4146}
.pres .first{font-weight:700;color:var(--navy)}
.method{margin-top:0;font-size:19px;line-height:1.55;padding:22px 28px}
.method p+p{margin-top:10px}

table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:var(--navy);color:#fff;font-weight:700;font-size:11px;letter-spacing:1px;
  text-transform:uppercase;padding:10px 12px;text-align:left}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
tbody tr:nth-child(even) td{background:#FBF8F0}
td.tk{font-weight:700;color:var(--navy);letter-spacing:.5px}
td.neg{color:var(--gold-deep)}
tfoot td{padding:10px 12px;background:var(--navy-deep);color:#fff;font-weight:700;letter-spacing:.5px}
tfoot .g{color:var(--gold)}
table.compacta{font-size:13px}
table.compacta tbody td{padding:7px 10px}
table.compacta thead th{padding:8px 10px;font-size:10px}
.note{font-family:'EB Garamond';font-style:italic;font-size:13px;color:var(--muted);margin-top:8px}

.contact-block{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--line)}
.contact-block .brand{font-family:'Cinzel';font-weight:600;font-size:15px;letter-spacing:1.4px;color:var(--navy)}
.contact-block .contact{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px}
.contact-block .handle{font-weight:700;font-size:12px;letter-spacing:1px;color:#fff;background:var(--navy);
  padding:8px 18px;border-radius:20px}
</style>
</head>
<body>
$diapositivas
<script>
  // En pantalla, achica las diapositivas para que entren en el ancho disponible.
  function ajustar() {
    var escala = Math.min(1, (window.innerWidth - 32) / 1280);
    document.querySelectorAll('.slide').forEach(function (s) { s.style.zoom = escala; });
  }
  window.addEventListener('resize', ajustar);
  ajustar();
</script>
</body>
</html>
